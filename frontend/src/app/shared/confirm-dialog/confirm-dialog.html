<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="close(false)">Cancel</button>
  <button mat-flat-button type="button" class="danger" (click)="close(true)">{{ data.confirmText }}</button>
</mat-dialog-actions>
